<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Feature Section</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-shell">

    <section class="hero" aria-labelledby="hero-title">

      <div class="hero-content">
        <p class="eyebrow">My Portfolio</p>

        <h1 id="hero-title">
          Plan your ideas and create something amazing.
        </h1>

        <p class="hero-intro">
          Explore my creative work, discover new ideas,
          and learn how I build beautiful websites using HTML and CSS.
        </p>

        <div class="hero-actions">
          <a class="button primary-button" href="#portfolio">
            View Portfolio
          </a>

          <a class="button secondary-button" href="#about">
            Learn More
          </a>
        </div>
      </div>

      <figure class="image-panel">
        <img
          class="desk-image"
          src="workshop-desk.png"
          alt="A laptop showing a website design beside a notebook and desk accessories"
        >

        <figcaption class="image-label">
          My Creative Workspace
        </figcaption>
      </figure>

    </section>

  </main>
</body>
</html>
